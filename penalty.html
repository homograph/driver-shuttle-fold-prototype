<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패널티 현황 프로토타입 · TADA-9314</title>
<style>
:root{
  --page:#0c1526; --bg:#101a3d; --card:#1e2d59; --notice:#233565; --sheet:#19254d;
  --line:#293f71; --title:#e6e9ef; --body:#c0c8d9; --label:#99a5c0; --white:#ffffff;
  --accent:#32a2fa; --green:#3ccb41; --btnDark:#31487d; --btnTx:#efeff1; --muted:#60667a;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --kr:"Noto Sans KR","Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:#f2f6ff;font-family:var(--kr);line-height:1.5}
.app{max-width:980px;margin:0 auto;padding:18px 16px 48px}
.head h1{font-size:18px;margin:0 0 3px;letter-spacing:-.02em}
.head p{margin:0;color:var(--label);font-size:12.5px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0e1c38}
.ctrl .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl .lbl{font-size:11px;color:var(--label);font-family:var(--mono);margin-right:2px}
.ctrl button{font-family:var(--kr);font-size:12px;color:var(--label);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.ctrl button.on{color:#fff;background:#26324f;border-color:#5b93ff}
.ctrl button:disabled{opacity:.35;cursor:not-allowed}
.ctrl .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.explain{font-size:12.5px;color:var(--body);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:16px;background:#0b1730}
.explain code{font-family:var(--mono);font-size:11.5px;color:var(--accent)}

.stage{display:flex;justify-content:center}
.phone{background:#0a1428;border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.scr{width:360px;height:760px;background:var(--bg);border:1px solid var(--line);border-radius:19px;overflow:hidden;
     display:flex;flex-direction:column;position:relative;font-size:16px}
.scr.big{font-size:19px}
.sb{height:24px;background:#000;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;color:#fff;font-size:.8125em}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* app bar */
.ab{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px;color:var(--white);font-weight:700;font-size:1.125em}
.ab .back{color:var(--title);font-weight:400;font-size:1.375em;cursor:pointer;line-height:1}
.ab .sp{flex:1}
.ab .i{font-size:.875em;font-weight:400;color:var(--label)}

.scroll{flex:1;overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:0}

/* ---------- 패널티 현황 ---------- */
.stack{display:flex;flex-direction:column;gap:20px;padding:10px 20px 24px}
.pcard{background:var(--card);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:20px;align-items:center}
.lamp{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:22px;padding:6px 8px;box-shadow:inset 0 0 4px rgba(0,0,0,.5)}
.lamp i{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.3);border:1px solid #000;display:block}
.lamp i.r.on{background:#d30700;box-shadow:0 0 4px 1px rgba(217,7,0,.6)}
.lamp i.g.on{background:#3ccb41;box-shadow:0 0 4px 1px rgba(60,203,65,.6)}
.phead{width:100%;display:flex;flex-direction:column;gap:16px}
.ptitle{font-size:1.5em;font-weight:700;color:var(--title);text-align:center}
.pnotice{display:flex;gap:10px;align-items:center;background:var(--notice);border-radius:8px;padding:16px}
.pnotice .ico{flex:none;width:18px;height:18px;border-radius:50%;background:var(--title);color:var(--notice);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pnotice p{margin:0;font-size:.9375em;color:var(--body)}
.pdetails{width:100%;display:flex;flex-direction:column;gap:16px;padding:10px}
.prow{display:flex;flex-direction:column;gap:4px}
.prow .l{font-size:1em;color:var(--label)}
.prow .v{font-size:1.125em;font-weight:700;color:var(--title)}
.prow .v.money{color:var(--white)}
.prow .s{font-size:1.125em;color:var(--accent)}
.prow .s.done{color:var(--green)}
.prow .s.holder{color:var(--label)}
.pdiv{height:1px;background:var(--line)}
.pbtns{width:100%;display:flex;flex-direction:column;gap:10px}
.btn{border-radius:4px;padding:15px 10px;text-align:center;font-size:1.25em;font-weight:700;cursor:pointer;user-select:none}
.btn.primary{background:var(--accent);color:var(--white)}
.btn.dark{background:var(--btnDark);color:var(--btnTx)}
.appeal{display:flex;flex-direction:column;gap:10px;align-items:center;padding:0 0 8px}
.appeal p{margin:0;font-size:.9375em;color:var(--muted);text-align:center}
.appeal .link{padding:10px 20px;font-size:1.25em;font-weight:700;color:#d5d7dc;cursor:pointer}

/* ---------- 예약콜 목록 (진입점) ---------- */
.tabs{flex:none;display:flex;padding:0 20px 12px;gap:8px}
.tabs div{flex:1;text-align:center;padding:10px 0;font-size:.9375em;color:var(--label);border-bottom:2px solid var(--line);cursor:pointer}
.tabs div.on{color:var(--white);font-weight:700;border-bottom-color:var(--accent)}
.empty{padding:80px 20px;text-align:center;color:var(--label);font-size:.9375em}
.banner{flex:none;margin:0 20px 20px;background:var(--card);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center;cursor:pointer}
.banner .bt{font-size:1.125em;color:var(--white);text-align:center;line-height:1.5}
.banner .btn{width:100%}

/* ---------- 바텀시트 ---------- */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:5}
.sheet{width:100%;max-height:80%;background:var(--sheet);border-radius:12px 12px 0 0;padding:20px;
       display:flex;flex-direction:column;gap:20px}
.shead{display:flex;flex-direction:column;gap:4px;align-items:center;flex:none}
.shead .cap{font-size:1em;color:var(--label)}
.shead .ttl{font-size:1.25em;font-weight:700;color:var(--white);text-align:center}
.sdiv{height:1px;background:var(--line);flex:none}
.ssum{display:flex;flex-direction:column;gap:4px;flex:none}
.srow{display:flex;gap:16px;font-size:1em}
.srow .l{color:var(--label);white-space:nowrap}
.srow .v{flex:1;text-align:right;color:#d5d7dc}
.slist{display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0}
.slist::-webkit-scrollbar{width:0}
.slist .cap{font-size:1em;color:var(--label);flex:none}
.sitem{display:flex;flex-direction:column;gap:2px}
.sitem .r1{display:flex;gap:16px;font-size:1em;color:#d5d7dc}
.sitem .r1 .a{flex:1}
.sitem .r2{display:flex;gap:16px;font-size:.9375em;color:var(--label)}
.sitem .r2 .a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* toast */
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:9;
  background:rgba(72,80,96,.94);color:#fff;font-size:.875em;padding:10px 16px;border-radius:20px;
  opacity:0;transition:opacity .18s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <h1>패널티 현황 프로토타입 · TADA-9314</h1>
    <p>Figma 신규 시안(콜 정지 화면 14946:116293) 그대로 + ‘자세히’ 바텀시트만 A안(합산 → 패널티 사유)으로 재구조화</p>
  </div>

  <div class="ctrl">
    <div class="grp"><span class="lbl">CASE</span>
      <button data-sc="res1" class="on">예약 · 단건</button>
      <button data-sc="dagon">다건(예약+셔틀)</button>
      <button data-sc="shuttle">셔틀</button>
      <button data-sc="realtime">실시간 · 예약</button>
      <button data-sc="winumi">위약금 3회 누적 미납</button>
    </div>
    <span class="sep"></span>
    <div class="grp"><span class="lbl">위약금</span>
      <button data-paid="0" class="on">미납</button>
      <button data-paid="1">납입 완료</button>
    </div>
    <span class="sep"></span>
    <div class="grp"><span class="lbl">기간</span>
      <button data-elapsed="0" class="on">남음</button>
      <button data-elapsed="1">충족</button>
    </div>
    <span class="sep"></span>
    <div class="grp"><span class="lbl">글자</span>
      <button data-fs="0" class="on">기본</button>
      <button data-fs="1">크게</button>
    </div>
  </div>

  <div class="explain" id="explain"></div>

  <div class="stage">
    <div class="phone">
      <div class="scr" id="scr">
        <div class="sb">12:30</div>
        <div class="screen" id="screen"></div>
        <div id="overlay"></div>
        <div class="toast" id="toast"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   TADA-9314 패널티 현황
   · 화면/카드 = Figma 신규 시안(14946:116293) 실측 그대로
       카드 = 신호등 → 패널티 이름(24) → Notice → 정보행(정지 기간/위약금/납입 가상 계좌) → 버튼
       생애주기 = 기간(남음/충족) × 납입(미납/완료) 4상태 + 위누미(무기한)
   · ‘자세히’ 시트 = A안(재구조화): 합산 요약 → "패널티 사유 N건" 구성 리스트
       (위누미만 캡션 예외 = 통일 계좌를 구성하는 미납 N건)
   · 사유 라벨 = PRD 정본(예약 수락 후 취소 / 예약 노쇼 / 셔틀 노쇼 / 지각 /
       월간 실시간 콜 수락 후 취소 기준 초과 / 위약금 3회 누적 미납)
   · 날짜·금액·계좌는 데모값. 실서버는 재계산된 유효 종료 시각.
   ========================================================================= */
const won = n => n.toLocaleString('ko-KR') + '원';
const ACC = {bank:'신한은행 749-462-898720', holder:'(주)브이씨엔씨'};
const ACC2 = {bank:'신한은행 123-456-987654', holder:'(주)브이씨엔씨'};
const ACC_UNI = {bank:'신한은행 555-902-114377', holder:'(주)브이씨엔씨'};

const CARD = {
  res1:{ product:'예약 콜', target:'일반 예약 · 시간대절 예약', kind:'term',
    period:'12시간', until:'26년 9월 15일 14:00', account:ACC,
    items:[{status:'적용 중', reason:'예약 수락 후 취소', when:'9월 5일 아침 11:20', route:'성수동1가 → 인천공항', hours:'12시간', fine:30000}] },
  shuttle:{ product:'셔틀 콜', target:'셔틀 예약', kind:'term',
    period:'12시간', until:'26년 9월 15일 14:00', account:ACC2,
    items:[{status:'적용 중', reason:'셔틀 노쇼', when:'9월 5일 아침 06:30', route:'판교 셔틀 A노선', hours:'12시간', fine:30000}] },
  realtime:{ product:'실시간 · 예약 콜', target:'실시간 콜 · 일반 예약 · 시간대절 예약', kind:'term',
    period:'24시간', until:'26년 9월 16일 10:00', account:ACC,
    items:[{status:'적용 중', reason:'월간 실시간 콜 수락 후 취소 기준 초과', when:'9월 누적 5회', route:'기준 3회 초과', hours:'24시간', fine:30000}] },
  winumi:{ product:'예약 콜', target:'일반 예약 · 시간대절 예약', kind:'indef',
    period:'무기한', until:null, account:ACC_UNI, caption:'통일 계좌를 구성하는 미납',
    items:[
      {status:'미납', reason:'셔틀 노쇼', when:'8월 20일 아침 06:30', route:'판교 셔틀 A노선', hours:null, fine:30000},
      {status:'미납', reason:'지각',      when:'8월 27일 낮 13:40',  route:'강남구 역삼동 → 김포공항', hours:null, fine:10000},
      {status:'미납', reason:'지각',      when:'9월 2일 저녁 19:10', route:'성수동1가 → 인천공항', hours:null, fine:10000}] }
};

const SCEN = {
  res1:    {label:'예약 · 단건',        banner:'예약 콜',        cards:['res1']},
  dagon:   {label:'다건(예약+셔틀)',    banner:'예약 · 셔틀 콜', cards:['res1','shuttle']},
  shuttle: {label:'셔틀',               banner:'셔틀 콜',        cards:['shuttle']},
  realtime:{label:'실시간 · 예약',      banner:'실시간 · 예약 콜',cards:['realtime']},
  winumi:  {label:'위약금 3회 누적 미납',banner:'예약 콜',        cards:['winumi']}
};

const state = {scenario:'res1', paid:false, elapsed:false, screen:'list', sheet:null, big:false};
const scr = document.getElementById('scr'), screen = document.getElementById('screen'), overlay = document.getElementById('overlay');
const sc = () => SCEN[state.scenario];
const cardsOf = () => sc().cards.map(k => CARD[k]);
const totalFine = c => c.items.reduce((s,i)=>s+i.fine,0);
const isReleased = c => c.kind === 'indef' ? state.paid : (state.paid && state.elapsed);

/* ---------- 카드 ---------- */
function noticeOf(c){
  if(isReleased(c))                     return {ico:'✓', text:'위약금 입금이 확인되었습니다.'};
  if(c.kind === 'indef')                return {ico:'!', text:'위약금을 납입하기 전까지 콜 정지가 실행됩니다.'};
  if(state.paid)                        return {ico:'!', text:'위약금 입금이 확인되었습니다. 남은 시간이 지나면 콜 정지가 해제됩니다.'};
  if(state.elapsed)                     return {ico:'!', text:'위약금을 납입하기 전까지 콜 정지가 실행됩니다.'};
  return {ico:'!', text:'위약금 입금이 지연되면 패널티 기간이 연장됩니다.'};
}
function periodSub(c){
  if(c.kind === 'indef') return '위약금 납입 시 해제';
  if(isReleased(c))      return '기간 충족';
  if(state.elapsed && !state.paid) return '위약금 미납으로 무기한 연장됨';
  return c.until + ' 까지';
}
function penaltyCard(c, idx){
  const released = isReleased(c), fine = totalFine(c);
  const n = noticeOf(c);
  const showPeriod = !(c.kind === 'indef' && released);
  const showAccount = !state.paid;
  return `<div class="pcard">
    <div class="lamp"><i class="r ${released?'':'on'}"></i><i class="a"></i><i class="g ${released?'on':''}"></i></div>
    <div class="phead">
      <div class="ptitle">${c.product} 정지${released?' 해제':''}</div>
      <div class="pnotice"><span class="ico">${n.ico}</span><p>${n.text}</p></div>
    </div>
    <div class="pdetails">
      ${showPeriod ? `<div class="prow"><span class="l">정지 기간</span><span class="v">${c.period}</span><span class="s">${periodSub(c)}</span></div><div class="pdiv"></div>` : ''}
      <div class="prow"><span class="l">위약금</span><span class="v money">${won(fine)}</span>
        <span class="s ${state.paid?'done':''}">${state.paid?'납입 완료':'납입 필요'}</span></div>
      ${showAccount ? `<div class="pdiv"></div>
      <div class="prow"><span class="l">납입 가상 계좌</span><span class="v">${c.account.bank}</span><span class="s holder">${c.account.holder}</span></div>` : ''}
    </div>
    <div class="pbtns">
      ${showAccount ? `<div class="btn primary" data-copy="1">계좌번호 복사하기</div>` : ''}
      <div class="btn dark" data-sheet="${idx}">자세히</div>
    </div>
  </div>`;
}

/* ---------- 화면 ---------- */
function renderList(){
  const s = sc(), c = cardsOf()[0], released = cardsOf().every(isReleased);
  const bar = `<div class="ab"><span class="back" data-toast="뒤로 (프로토타입)">←</span> 예약콜 목록 <span class="sp"></span><span class="i">⇅ 추천순</span></div>
    <div class="tabs"><div class="on">수락가능 콜</div><div data-toast="내 예약 (프로토타입)">내 예약(8)</div></div>`;
  if(released){
    return `${bar}<div class="scroll"><div class="empty">지금 받을 수 있는 콜을 모두 확인했습니다</div></div>
      <div class="banner" data-go="status"><div class="bt">패널티가 해제되었습니다</div><div class="btn dark">패널티 현황 보기</div></div>`;
  }
  const until = c.kind === 'indef' ? '위약금 납입 시까지' : c.until + ' 까지';
  return `${bar}<div class="scroll"><div class="empty">수락 가능한 콜이 없습니다.</div></div>
    <div class="banner" data-go="status"><div class="bt">${until}<br>${s.banner} 정지</div><div class="btn dark">자세히 보기</div></div>`;
}
function renderStatus(){
  return `<div class="ab"><span class="back" data-go="list">←</span> 패널티 현황</div>
    <div class="scroll"><div class="stack">
      ${cardsOf().map(penaltyCard).join('')}
      <div class="appeal">
        <p>패널티 사유에 대한 이의제기는<br>타다 드라이버 고객센터로 접수 가능합니다.</p>
        <div class="link" data-toast="이의제기 접수 (프로토타입)">이의제기</div>
      </div>
    </div></div>`;
}

/* ---------- 자세히 시트 (A안) ---------- */
function sheetRows(c){
  /* 라벨 고정 — 기간형은 5행(정지 대상/정지 기간/해제/위약금/사유), 위누미는 4행 + 구성 리스트 */
  const released = isReleased(c), fine = totalFine(c);
  const release = released ? (c.until || '위약금 납입 완료')
    : (c.kind === 'indef' || state.elapsed) ? '위약금 납입 시' : c.until;
  const rows = [
    ['정지 대상', c.target],
    ['정지 기간', c.period],
    ['해제', release],
    ['위약금', won(fine) + ' · ' + (state.paid ? '납입 완료' : '납입 필요')]
  ];
  if(c.kind !== 'indef') rows.push(['사유', reasonOf(c)]);
  return rows;
}
function reasonOf(c){ return c.items[0].reason; }   /* 밴 누적은 카드가 늘어나는 방식 → 사유는 항상 1건 */
function renderSheet(){
  if(state.sheet === null) return '';
  const c = cardsOf()[state.sheet];
  /* 구성 리스트는 위누미에서만 — 같은 금액의 미납건을 구분해야 하므로 운행 건 표시가 필수 */
  const list = c.kind !== 'indef' ? '' : `<div class="slist"><span class="cap">통일 계좌를 구성하는 미납 ${c.items.length}건</span>
      ${c.items.map(i=>`<div class="sitem">
        <div class="r1"><span class="a">${i.reason}</span><span>${won(i.fine)}</span></div>
        <div class="r2"><span class="a">${i.when}${i.route?' · '+i.route:''}</span></div>
      </div>`).join('')}
    </div>
    <div class="sdiv"></div>`;
  return `<div class="dim" data-close="1"><div class="sheet" data-stop="1">
    <div class="shead"><span class="cap">패널티 상세</span><span class="ttl">${c.product} 정지${isReleased(c)?' 해제':''}</span></div>
    <div class="sdiv"></div>
    <div class="ssum">${sheetRows(c).map(([l,v])=>`<div class="srow"><span class="l">${l}</span><span class="v">${v}</span></div>`).join('')}</div>
    <div class="sdiv"></div>
    ${list}
    <div class="btn dark" data-close="1">닫기</div>
  </div></div>`;
}
function statusOf(i, c){
  if(c.kind === 'indef') return state.paid ? '납입 완료' : '미납';
  if(isReleased(c)) return '종료';
  return i.status;
}

/* ---------- render / nav ---------- */
function render(){
  scr.classList.toggle('big', state.big);
  screen.innerHTML = (state.screen === 'status' ? renderStatus : renderList)();
  overlay.innerHTML = renderSheet();
  document.querySelectorAll('[data-elapsed]').forEach(b => b.disabled = cardsOf().every(c => c.kind === 'indef'));
  explain();
}
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 1500);
}
scr.addEventListener('click', e => {
  if(e.target.closest('[data-stop]') && !e.target.closest('[data-close]')) return;
  const close = e.target.closest('[data-close]'); if(close){ state.sheet = null; render(); return; }
  const sh = e.target.closest('[data-sheet]'); if(sh){ state.sheet = +sh.dataset.sheet; render(); return; }
  const go = e.target.closest('[data-go]'); if(go){ state.screen = go.dataset.go; state.sheet = null; render(); return; }
  if(e.target.closest('[data-copy]')){ toast('계좌번호가 복사되었습니다.'); return; }
  const t = e.target.closest('[data-toast]'); if(t){ toast(t.dataset.toast); }
});

function explain(){
  const c = cardsOf()[0], released = isReleased(c);
  let life;
  if(c.kind === 'indef') life = released
    ? '위누미 <b>납입 완료 → 해제</b> — 기간 행 자체가 사라지고 초록 신호등.'
    : '위누미 = <b>무기한 · 위약금 납입 시 해제</b>. 통일 계좌 1개로 합산 금액 납입.';
  else if(released) life = '<b>기간 충족 + 납입 완료 → 해제</b> — 제목 “○○ 콜 정지 해제”, 기간 서브 “기간 충족”.';
  else if(state.paid) life = '<b>기간 남음 + 납입 완료</b> — 계좌·복사 버튼이 사라지고 <code>자세히</code>만 남음.';
  else if(state.elapsed) life = '<b>기간 충족 + 미납</b> — 기간 서브가 “위약금 미납으로 무기한 연장됨”으로 바뀜.';
  else life = '<b>기간 남음 + 미납</b> — 기본 상태(계좌 + 복사 버튼 + 자세히).';
  document.getElementById('explain').innerHTML =
    `<b>케이스: ${sc().label}</b> — ${life}<br>
     <span style="color:var(--label)">플로우: <code>예약콜 목록(빈 리스트 + 배너)</code> → <code>자세히 보기</code> → <code>패널티 현황</code> → <code>자세히</code> → 바텀시트.
     시트 = 합산 요약(정지 대상 / 정지 기간 / 해제 / 위약금) + <b>패널티 사유 N건</b> 구성 리스트. 위누미만 캡션이 “통일 계좌를 구성하는 미납 N건”.</span>`;
}

/* ---------- controls ---------- */
function bind(attr, fn){
  document.querySelectorAll('.ctrl [data-'+attr+']').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.ctrl [data-'+attr+']').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); fn(b.dataset[attr]); render();
  }));
}
bind('sc', v => { state.scenario = v; state.screen = 'list'; state.sheet = null; state.paid = false; state.elapsed = false;
  document.querySelectorAll('.ctrl [data-paid]').forEach((x,i) => x.classList.toggle('on', i === 0));
  document.querySelectorAll('.ctrl [data-elapsed]').forEach((x,i) => x.classList.toggle('on', i === 0)); });
bind('paid',    v => state.paid = v === '1');
bind('elapsed', v => state.elapsed = v === '1');
bind('fs',      v => state.big = v === '1');

render();
</script>
</body>
</html>
