<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패널티 안내 프로토타입 · TADA-9314</title>
<style>
:root{
  --page:#0c1526; --nv:#101a3d; --card:#1e2d59; --line:#293f71; --txt:#f2f6ff; --sub:#99a5c0;
  --blue:#298dff; --btn:#26324f; --btnln:#5b93ff;
  --red:#ff7c7c; --redbg:rgba(255,124,124,.12); --redln:rgba(255,124,124,.4);
  --amber:#ffba4c; --amberbg:rgba(255,186,76,.12); --amberln:rgba(255,186,76,.4);
  --green:#7ee081;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --kr:"Apple SD Gothic Neo","Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--txt);font-family:var(--kr);line-height:1.5}
.app{max-width:920px;margin:0 auto;padding:18px 16px 40px}
.head h1{font-size:18px;margin:0 0 3px;letter-spacing:-.02em}
.head p{margin:0;color:var(--sub);font-size:12.5px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0e1c38}
.ctrl .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctrl .lbl{font-size:11px;color:var(--sub);font-family:var(--mono);margin-right:2px}
.ctrl button{font-family:var(--kr);font-size:12px;color:var(--sub);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.ctrl button.on{color:#fff;background:var(--btn);border-color:var(--btnln)}
.ctrl .sep{width:1px;height:20px;background:var(--line);margin:0 4px}

.stage{display:flex;justify-content:center}
.phone{width:100%;max-width:390px;background:#0a1428;border:1px solid var(--line);border-radius:26px;padding:8px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.scr{background:var(--nv);border:1px solid var(--line);border-radius:19px;overflow:hidden;display:flex;flex-direction:column;height:730px;font-size:14px;position:relative}
.scr.big{font-size:17px}
.sb{height:1.4em;background:#0b1730;flex:none}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}

/* app bar */
.ab{padding:.75em .85em;font-weight:800;display:flex;align-items:center;gap:.5em;border-bottom:1px solid var(--line);flex:none}
.ab .sp{flex:1}
.ab .i{color:var(--sub);font-weight:600;font-size:.82em}
.ab .ic{cursor:pointer;color:var(--txt)}

/* tabs */
.tabs{display:flex;font-size:.92em;border-bottom:1px solid var(--line);flex:none}
.tabs div{flex:1;text-align:center;padding:.8em 0;color:var(--sub);cursor:pointer}
.tabs .on{color:var(--txt);font-weight:800;box-shadow:inset 0 -3px 0 var(--blue)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;display:flex;flex-direction:column}

/* 예약콜 목록 — 빈 상태 */
.emptycall{flex:1;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:.95em;text-align:center;padding:2em}

/* 정상 콜 카드 */
.list{padding:.6em;display:flex;flex-direction:column;gap:.55em}
.sortrow{display:flex;gap:.4em;font-size:.82em;margin-bottom:.1em}
.sortrow .c{border:1px solid var(--line);border-radius:999px;padding:.3em .7em;color:var(--sub);background:transparent;font-family:var(--kr);cursor:pointer}
.sortrow .c.act{color:#fff;border-color:var(--btnln)}
.sortrow .f{margin-left:auto}
.call{background:var(--card);border-radius:.75em;padding:.72em;display:flex;gap:.6em;cursor:pointer;border:1px solid transparent}
.call:active{border-color:var(--btnln)}
.call .lft{width:4.6em;flex:none}
.call .lft b{font-weight:800}.call .lft span{display:block;font-size:.78em;color:var(--sub)}
.call .rgt{flex:1;min-width:0}
.call .route{font-size:.92em}
.call .bd{display:flex;flex-wrap:wrap;gap:.3em;margin:.38em 0}
.call .bd i{font-style:normal;font-size:.72em;background:#334870;color:#cdd9f2;border-radius:.4em;padding:.17em .5em}
.call .bd i.type{font-weight:700}
.call .foot{display:flex;justify-content:flex-end;margin-top:.3em}
.call .pr{text-align:right;font-weight:800}

/* 하단 도킹 정지 배너 (컨텍스트) */
.blockban{flex:none;margin:.2em .7em .8em;border:1px solid var(--line);border-radius:.85em;padding:1em .9em;background:#16223d}
.blockban .bd{text-align:center;font-weight:800;color:var(--red);font-size:1.02em;line-height:1.35}
.blockban .bp{text-align:center;font-weight:700;color:var(--txt);margin-top:.15em}
.blockban .bbtn{margin-top:.85em;text-align:center;font-weight:800;background:var(--btn);border:1px solid var(--line);border-radius:.6em;padding:.8em;cursor:pointer;color:#fff}
.blockban .bbtn:active{border-color:var(--btnln)}

/* ===== 패널티 현황 상세 (v3 · board + 정보패널) ===== */
.detail{padding:.85em .8em 1.4em;display:flex;flex-direction:column;gap:.85em}
.pcard2{background:var(--card);border-radius:.85em;padding:1.15em 1.05em;display:flex;flex-direction:column;gap:.85em}
.p-badgewrap{text-align:center}
.badge2{display:inline-flex;align-items:center;gap:.45em;background:#0f1c37;border:1px solid var(--line);border-radius:999px;padding:.4em .95em;font-size:.82em;font-weight:800;color:#e6e9ef}
.badge2 .dot{width:.62em;height:.62em;border-radius:50%}
.badge2.act .dot{background:var(--red);box-shadow:0 0 .5em rgba(255,124,124,.9)}
.badge2.soon .dot{background:var(--amber);box-shadow:0 0 .5em rgba(255,186,76,.9)}
.badge2.ok .dot{background:var(--green);box-shadow:0 0 .5em rgba(126,224,129,.9)}
.traffic{display:inline-flex;gap:.55em;align-items:center;background:#0f1c37;border:1px solid var(--line);border-radius:999px;padding:.5em .85em}
.traffic .d{width:.72em;height:.72em;border-radius:50%;opacity:.28}
.traffic .d.r{background:var(--red)} .traffic .d.a{background:var(--amber)} .traffic .d.g{background:var(--green)}
.traffic .d.on{opacity:1}
.traffic .d.r.on{box-shadow:0 0 .55em rgba(255,124,124,.95)}
.traffic .d.g.on{box-shadow:0 0 .55em rgba(126,224,129,.95)}
.p-head{text-align:center;font-size:1.55em;font-weight:800;line-height:1.22;letter-spacing:-.01em}
.p-restrict{text-align:center;color:var(--sub);font-size:.92em;line-height:1.4}
.p-when{text-align:center;font-weight:800;font-size:1em;line-height:1.5}
.p-when.act{color:var(--red)} .p-when.soon{color:var(--amber)}
.p-panel{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:.95em 0;display:flex;flex-direction:column;gap:.7em}
.inforow2{display:flex;gap:1.1em;font-size:.92em;align-items:baseline}
.inforow2 .l{color:var(--sub);width:2.6em;flex:none}
.inforow2 .v{color:var(--txt);flex:1}
.p-note{font-size:.82em;color:var(--sub);line-height:1.55}
.p-detail-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);margin-top:.1em;padding-top:.85em;font-size:.92em;color:#e6e9ef;cursor:pointer}
.p-detail-row .cv{color:var(--sub)}
.p-empty{text-align:center;color:var(--sub);font-size:.9em;line-height:1.6;padding:.4em 0 .2em}

.appeal-info{display:flex;gap:.45em;font-size:.82em;color:var(--sub);line-height:1.55;padding:.2em .15em}
.appeal-btn{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--blue);border-radius:.7em;padding:.9em;font-size:.95em;font-weight:800;color:#fff;cursor:pointer}

.toast{position:absolute;left:50%;bottom:1.4em;transform:translateX(-50%) translateY(1em);opacity:0;transition:.2s;pointer-events:none;background:#0b1830;border:1px solid var(--line);color:var(--txt);font-size:.82em;padding:.55em .9em;border-radius:999px;white-space:nowrap;z-index:5}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{margin-top:12px;color:var(--sub);font-size:12px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.note b{color:var(--txt)}
.note code{font-family:var(--mono);color:#bcd3ff;font-size:.92em}
</style>
</head>
<body>
<div class="app">
  <p style="margin:0 0 10px"><a href="index.html" style="color:#5b93ff;font-size:13px;text-decoration:none">← 셔틀 프로토타입 허브</a></p>
  <div class="head">
    <h1>⚠️ 드라이버앱 패널티 안내 <span style="font-family:var(--mono);font-size:11px;color:var(--btnln)">TADA-9314</span></h1>
    <p>확정 플로우 — <b>예약콜 목록(빈 리스트 + 하단 정지 배너)</b> → <b>자세히 보기</b> → <b>패널티 현황 상세</b>. 시나리오를 바꿔가며 배너·상세를 눌러보세요. (실데이터 아님)</p>
  </div>

  <div class="ctrl">
    <div class="grp"><span class="lbl">시나리오</span>
      <button data-sc="reservation" class="on">예약 정지</button>
      <button data-sc="shuttle">셔틀 정지</button>
      <button data-sc="realtime">실시간·예약 정지</button>
      <button data-sc="dagon">다건(예약+셔틀)</button>
      <button data-sc="none">정상</button>
    </div>
    <div class="sep"></div>
    <div class="grp"><span class="lbl">글씨</span>
      <button data-fs="0" class="on">기본</button>
      <button data-fs="1">크게(sp)</button>
    </div>
  </div>

  <div class="stage">
    <div class="phone"><div class="scr" id="scr">
      <div class="sb"></div>
      <div class="screen" id="screen"></div>
      <div class="toast" id="toast"></div>
    </div></div>
  </div>

  <div class="note" id="explain"></div>
  <p style="margin-top:10px;text-align:center;color:var(--sub);font-size:12px">‘정지 예정’ 상태는 PRD 미정의라 보류 · 기존 셔틀 프로토타입은 그대로 · <a href="index.html" style="color:var(--btnln)">허브 →</a></p>
</div>

<script>
/* ---------- data ----------
 확정 플로우: 콜 목록(빈 리스트 + 하단 컨텍스트 배너) → 자세히 보기 → 패널티 현황 상세(v3 카드)
 · 정지 = 조회+수락 정지 → 콜 목록에 아무것도 안 보임(빈 리스트). 하단 배너로 사유·기간 안내.
 · 상세 카드: 배지(적용중) · [상품] 콜 패널티 · 큰 날짜(까지) · 대상/기간/사유 · 위약금 연장.
 · 다건 = 상품별 카드 2개. 실시간콜 초과 = 실시간+예약 묶음 1건.
 · 날짜/기간은 데모용 예시(실서버는 재계산된 유효 종료 시각). '노쇼(driver_no_show)'는 내부 코드라 표시 사유는 '예약 불이행'. */
const won = n => n.toLocaleString('ko-KR')+'원';

const SCEN = {
  reservation:{
    tab:'예약', bannerProd:'예약 콜', until:'8월 15일 24:00',
    cards:[{head:'예약 콜', target:'일반 예약 · 시간대절 예약', when:'8월 15일 24:00', period:'8월 13일 (수) 00:00 ~ 8월 15일 (금) 24:00', reason:'예약 수락 후 취소'}]
  },
  shuttle:{
    tab:'셔틀', bannerProd:'셔틀 콜', until:'7월 28일 24:00',
    cards:[{head:'셔틀 콜', target:'셔틀 예약', when:'7월 28일 24:00', period:'7월 26일 (토) 24:00 ~ 7월 28일 (월) 24:00', reason:'예약 수락 후 취소'}]
  },
  realtime:{
    tab:'실시간', bannerProd:'실시간·예약 콜', until:'8월 10일 24:00',
    cards:[{head:'실시간·예약 콜', target:'실시간 콜 · 일반 예약 · 시간대절 예약', when:'8월 10일 24:00', period:'8월 8일 (금) 24:00 ~ 8월 10일 (일) 24:00', reason:'다건의 실시간 콜 수락 후 취소'}]
  },
  dagon:{
    tab:'다건', bannerProd:'예약·셔틀 콜', until:'8월 15일 24:00',
    cards:[
      {head:'예약 콜', target:'일반 예약 · 시간대절 예약', when:'8월 15일 24:00', period:'8월 13일 (수) 00:00 ~ 8월 15일 (금) 24:00', reason:'예약 수락 후 취소'},
      {head:'셔틀 콜', target:'셔틀 예약', when:'7월 28일 24:00', period:'7월 26일 (토) 24:00 ~ 7월 28일 (월) 24:00', reason:'예약 수락 후 취소'}
    ]
  },
  none:{ tab:'정상', bannerProd:null, cards:[] }
};

/* 정상 시나리오용 콜 카드 */
const CALLS = [
  {date:'오늘',           time:'아침 11:20', type:'셔틀예약', route:'성동구 성수동1가 → 인천국제공항', price:25000, badges:['임박']},
  {date:'내일',           time:'아침 11:20', type:'일반예약', route:'성동구 성수동1가 → 인천국제공항', price:47500, badges:['단골','추천']},
  {date:'8월 19일 (화)',  time:'아침 11:40', type:'시간대절', route:'동대문구 답십리1동 → 인천국제공항', price:81400, badges:['카시트']},
];

/* ---------- state ---------- */
const state = { scenario:'reservation', screen:'list', big:false };
const scr=document.getElementById('scr'), screen=document.getElementById('screen');
const sc = () => SCEN[state.scenario];
const blocked = () => sc().cards.length>0;

/* ---------- 예약콜 목록 ---------- */
function callCard(c){
  const rest=(c.badges||[]).map(b=>`<i>${b}</i>`).join('');
  return `<div class="call" data-toast="콜 상세로 이동 (프로토타입)">
    <div class="lft"><b>${c.date}</b><span>${c.time}</span></div>
    <div class="rgt"><div class="route">${c.route}</div>
      <div class="bd"><i class="type">${c.type}</i>${rest}</div>
      <div class="foot"><div class="pr">${won(c.price)}</div></div>
    </div></div>`;
}
function renderList(){
  const s=sc();
  const appbar=`<div class="ab"><span class="ic" data-toast="뒤로 (프로토타입)">←</span> 예약콜 목록 <span class="sp"></span><span class="i">⇅ 추천순</span></div>
    <div class="tabs"><div class="on">수락가능 콜</div><div data-toast="내 예약 (프로토타입)">내 예약(8)</div></div>`;
  if(!blocked()){
    // 정상 — 콜 노출, 배너 없음
    return `${appbar}<div class="scroll"><div class="list">
      <div class="sortrow"><button class="f c" data-toast="공항콜만 보기 (프로토타입)">✈ 공항콜만 보기</button><button class="c act" data-toast="정렬 (프로토타입)">↕ 추천순</button></div>
      ${CALLS.map(callCard).join('')}
    </div></div>`;
  }
  // 정지 — 빈 리스트 + 하단 컨텍스트 배너
  return `${appbar}
    <div class="scroll"><div class="emptycall">수락 가능한 콜이 없습니다.</div></div>
    <div class="blockban" data-go="detail">
      <div class="bd">${s.until}까지</div>
      <div class="bp">${s.bannerProd} 정지</div>
      <div class="bbtn">자세히 보기</div>
    </div>`;
}

/* ---------- 패널티 현황 상세 (v3) ---------- */
function pcard(c){
  return `<div class="pcard2">
    <div class="p-badgewrap"><div class="traffic"><span class="d r on"></span><span class="d a"></span><span class="d g"></span></div></div>
    <div class="p-head">${c.head} 정지</div>
    <div class="p-restrict">조회·수락 불가</div>
    <div class="p-when act">${c.when} 까지</div>
    <div class="p-panel">
      <div class="inforow2"><span class="l">대상</span><span class="v">${c.target}</span></div>
      <div class="inforow2"><span class="l">기간</span><span class="v">${c.period}</span></div>
      <div class="inforow2"><span class="l">사유</span><span class="v">${c.reason}</span></div>
    </div>
    <div class="p-note">위약금 입금이 지연되면 패널티 기간이 연장돼요.</div>
  </div>`;
}
function renderDetail(){
  const s=sc();
  const appbar=`<div class="ab"><span class="ic" data-go="back">←</span> 패널티 현황 <span class="sp"></span></div>`;
  if(!blocked()){
    return `${appbar}<div class="scroll"><div class="detail">
      <div class="pcard2">
        <div class="p-badgewrap"><div class="traffic"><span class="d r"></span><span class="d a"></span><span class="d g on"></span></div></div>
        <div class="p-head">패널티 없음</div>
        <div class="p-empty">현재 적용 중인 패널티가 없습니다.<br>안전 운행에 감사드립니다.</div>
      </div>
    </div></div>`;
  }
  return `${appbar}<div class="scroll"><div class="detail">
    ${s.cards.map(pcard).join('')}
    <div class="appeal-info">패널티 사유에 대한 이의제기는 타다 드라이버 콜센터(1800-9198) 또는 게시판으로 접수 가능합니다.</div>
    <div class="appeal-btn" data-toast="이의제기 접수 (프로토타입 · 콜센터 1800-9198)">이의 제기</div>
  </div></div>`;
}

/* ---------- render / nav ---------- */
function render(){
  scr.classList.toggle('big', state.big);
  screen.innerHTML = (state.screen==='detail'?renderDetail:renderList)();
  explain();
}
function go(target){
  if(target==='back') state.screen='list';
  else state.screen=target;
  render();
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1400); }

scr.addEventListener('click', e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const t=e.target.closest('[data-toast]'); if(t){ toast(t.dataset.toast); return; }
});

function explain(){
  const s=sc();
  let desc;
  if(state.scenario==='none') desc='패널티 없음 — 콜 목록 정상 노출(배너 없음). 상세 진입 시 “패널티 없음”.';
  else if(state.scenario==='dagon') desc='예약+셔틀 <b>서로 다른 두 패널티</b> 동시 — 배너는 “예약·셔틀 콜 정지”, 상세는 <b>상품별 카드 2개</b>.';
  else if(state.scenario==='realtime') desc='월간 실시간콜 초과 — <b>실시간+예약(일반·시간대절) 묶음</b> 1건 정지. (사유 수 1개이므로 단건 카드)';
  else desc=`${s.tab} 취소 → <b>조회+수락 정지</b>라 콜 목록이 <b>빈 리스트</b>. 하단 배너 → 자세히 보기 → 상세 카드.`;
  document.getElementById('explain').innerHTML =
    `<b>시나리오: ${s.tab}</b> — ${desc}<br>
     <span style="color:var(--sub)">플로우: <code>예약콜 목록(빈+배너)</code> → <code>자세히 보기</code> → <code>패널티 현황 상세</code>. 상세 카드 = 신호등 · <b style="color:var(--txt)">[상품] 콜 정지</b> · 조회·수락 불가(중립) · 큰 날짜(빨강) · 대상/기간/사유 · 위약금 연장. ‘정지 예정’은 PRD 미정의라 보류.</span>`;
}

/* ---------- controls ---------- */
document.querySelectorAll('.ctrl [data-sc]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ctrl [data-sc]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.scenario=b.dataset.sc; state.screen='list'; render();
}));
document.querySelectorAll('.ctrl [data-fs]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ctrl [data-fs]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  state.big=b.dataset.fs==='1'; render();
}));

render();
</script>
</body>
</html>
